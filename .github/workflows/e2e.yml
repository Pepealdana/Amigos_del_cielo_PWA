name: Pruebas E2E PWA

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "manifest.json"
      - "service-worker.js"
      - "js/**"
      - "css/**"
      - "data/**"
      - "assets/**"
      - "tests/**"
      - "playwright.config.js"
      - "package.json"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "index.html"
      - "manifest.json"
      - "service-worker.js"
      - "js/**"
      - "css/**"
      - "data/**"
      - "assets/**"
      - "tests/**"
      - "playwright.config.js"
      - "package.json"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    name: E2E — escritorio y Android emulado
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias E2E
        run: npm install

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e

      - name: Publicar reporte Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
