name: Validar aplicación Amigos del Cielo

on:
  push:
    paths:
      - 'data/**'
      - 'js/**'
      - 'scripts/**'
      - 'service-worker.js'
      - 'index.html'
      - 'manifest.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'data/**'
      - 'js/**'
      - 'scripts/**'
      - 'service-worker.js'
      - 'index.html'
      - 'manifest.json'
      - '.github/workflows/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar datos
        run: node scripts/validate-data.js

      - name: Validar integridad de la aplicación
        run: node scripts/validate-app.js
