<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Amigos del Cielo</title>

    <meta
        name="description"
        content="Novenas, santos y oración diaria.">

    <meta
        name="theme-color"
        content="#2C4A6B">

    <meta
        name="mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default">

    <meta
        name="apple-mobile-web-app-title"
        content="Amigos del Cielo">

    <link
        rel="manifest"
        href="manifest.json">

    <link
        rel="icon"
        href="assets/icons/icon-192.png">

    <link
        rel="apple-touch-icon"
        href="assets/icons/icon-192.png">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <!-- ==========================
         OVERLAY
    =========================== -->

    <div
        id="menu-overlay"
        class="menu-overlay">
    </div>

    <!-- ==========================
         MENÚ LATERAL
    =========================== -->

    <nav
        id="side-menu"
        class="side-menu"
        aria-label="Navegación principal">

        <div class="menu-header">

            <img
                src="assets/icons/logosin.png"
                alt="Logo Amigos del Cielo"
                class="menu-logo">

            <h2>Amigos del Cielo</h2>

            <p>Camina junto a los santos</p>

        </div>

        <button id="menu-inicio" type="button">
            Inicio
        </button>

        <button id="menu-biblioteca" type="button">
            Biblioteca
        </button>

        <button id="menu-favoritas" type="button">
            Favoritas
        </button>

        <button id="menu-progreso" type="button">
            Mi progreso
        </button>

        <button id="menu-configuracion" type="button">
            Configuración
        </button>

        <button id="menu-participa" type="button">
            Participa
        </button>

        <button id="menu-acerca" type="button">
            Acerca de
        </button>

    </nav>

    <!-- ==========================
         APLICACIÓN
    =========================== -->

    <div id="app">

        <header class="header">

            <div class="header-top">

                <button
                    id="btn-menu"
                    class="icon-button"
                    aria-label="Abrir menú"
                    aria-controls="side-menu"
                    aria-expanded="false"
                    type="button">
                    ☰
                </button>

                <div class="header-brand">

                    <img
                        src="assets/icons/logosin.png"
                        alt=""
                        class="app-logo"
                        aria-hidden="true">

                    <div class="header-brand-text">

                        <p class="header-brand-name">
                            Amigos del Cielo
                        </p>

                        <p class="header-brand-subtitle">
                            Camina junto a los santos
                        </p>

                    </div>

                </div>

                <button
                    class="icon-button"
                    id="btn-header-settings"
                    aria-label="Configuración"
                    type="button">
                    ⚙
                </button>

                <span
                    class="header-spacer"
                    aria-hidden="true">
                </span>

            </div>

        </header>

        <main id="view"></main>

        <div
            id="connection-status"
            class="connection-status"
            role="status"
            aria-live="polite"
            hidden>
        </div>

    </div>

    <!-- ==========================
         NAVEGACIÓN MÓVIL
    =========================== -->

    <nav
        class="bottom-nav"
        aria-label="Navegación inferior">

        <button
            class="bottom-nav-item active"
            data-route="inicio"
            type="button">

            <span class="bottom-nav-icon" aria-hidden="true">⌂</span>
            <span>Inicio</span>

        </button>

        <button
            class="bottom-nav-item"
            data-route="biblioteca"
            type="button">

            <span class="bottom-nav-icon" aria-hidden="true">◉</span>
            <span>Biblioteca</span>

        </button>

        <button
            class="bottom-nav-item"
            data-route="favoritas"
            type="button">

            <span class="bottom-nav-icon" aria-hidden="true">♡</span>
            <span>Favoritas</span>

        </button>

    </nav>

    <noscript>
        Esta aplicación necesita JavaScript para funcionar correctamente.
    </noscript>

    <!-- ==========================
         CONFIGURACIÓN
    =========================== -->

    <script src="js/config/appConfig.js"></script>

    <!-- ==========================
         ESTADO
    =========================== -->

    <script src="js/state/state.js"></script>

    <!-- ==========================
         SERVICIOS
    =========================== -->

    <script src="js/services/storage.js"></script>
    <script src="js/services/dataService.js"></script>

    <!-- ==========================
         UTILIDADES
    =========================== -->

    <script src="js/utils/constants.js"></script>
    <script src="js/utils/dateUtils.js"></script>
    <script src="js/utils/domUtils.js"></script>
    <script src="js/utils/formatUtils.js"></script>
    <script src="js/utils/searchUtils.js"></script>
    <script src="js/utils/validators.js"></script>

    <!-- ==========================
         COMPONENTES COMPARTIDOS
    =========================== -->

    <script src="js/render/shared/button.js"></script>
    <script src="js/render/shared/badge.js"></script>
    <script src="js/render/shared/card.js"></script>
    <script src="js/render/shared/chip.js"></script>
    <script src="js/render/shared/divider.js"></script>
    <script src="js/render/shared/emptyState.js"></script>
    <script src="js/render/shared/header.js"></script>
    <script src="js/render/shared/intenciones.js"></script>
    <script src="js/render/shared/lista.js"></script>
    <script src="js/render/shared/loader.js"></script>
    <script src="js/render/shared/modal.js"></script>
    <script src="js/render/shared/oracion.js"></script>

    <!-- ==========================
         COMPONENTES DE NOVENA
    =========================== -->

    <script src="js/render/novena/componentes.js"></script>
    <script src="js/render/novena/portada.js"></script>
    <script src="js/render/novena/historia.js"></script>
    <script src="js/render/novena/dia.js"></script>
    <script src="js/render/novena/oraciones.js"></script>
    <script src="js/render/novena/intenciones.js"></script>
    <script src="js/render/novena/agradecimiento.js"></script>

    <!-- ==========================
         RENDER HOME
    =========================== -->

    <script src="js/render/home/inicio.js"></script>
    <script src="js/render/home/biblioteca.js"></script>
    <script src="js/render/home/favoritas.js"></script>
    <script src="js/render/home/progreso.js"></script>
    <script src="js/render/home/configuracion.js"></script>
    <script src="js/render/home/acerca.js"></script>
    <script src="js/render/home/participa.js"></script>

    <!-- ==========================
         ROUTER
    =========================== -->

    <script src="js/router.js"></script>

    <!-- ==========================
         APP
    =========================== -->

    <script src="js/app.js"></script>

</body>

</html>
